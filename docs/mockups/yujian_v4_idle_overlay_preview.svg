<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560" role="img" aria-labelledby="title desc">
  <title id="title">Yujian V4 idle overlay motion preview</title>
  <desc id="desc">Animated SVG preview showing secondary idle overlays on a locked V4 skeleton pose.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071013"/>
      <stop offset="0.55" stop-color="#11171a"/>
      <stop offset="1" stop-color="#07161a"/>
    </linearGradient>
    <radialGradient id="cyanAura" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#7dfcff" stop-opacity="0.18"/>
      <stop offset="0.48" stop-color="#45d7e8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0b1114" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hardGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.95 0 0 0 0 1 0 0 0 0.85 0" result="cyan"/>
      <feMerge>
        <feMergeNode in="cyan"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .panel { fill: rgba(255,255,255,0.035); stroke: rgba(146,237,243,0.16); stroke-width: 1; }
      .label { fill: rgba(219,252,255,0.72); font: 600 16px Arial, sans-serif; letter-spacing: 0; }
      .sub { fill: rgba(185,218,221,0.45); font: 12px Arial, sans-serif; letter-spacing: 0; }
      .bone-back { fill: none; stroke: rgba(63,77,78,0.82); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .bone-core { fill: none; stroke: rgba(23,27,28,0.95); stroke-width: 5.8; stroke-linecap: round; stroke-linejoin: round; }
      .bone-rim { fill: none; stroke: rgba(214,224,216,0.68); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .body-fill { fill: rgba(16,18,19,0.94); stroke: rgba(210,222,215,0.52); stroke-width: 1.4; }
      .head { fill: rgba(15,17,18,0.96); stroke: rgba(223,234,226,0.78); stroke-width: 1.8; }
      .joint { fill: rgba(122,255,255,0.26); stroke: rgba(224,255,255,0.42); stroke-width: 0.8; }
      .locked-dot { opacity: 0.58; }
      .sword-core { stroke: rgba(216,255,255,0.95); stroke-width: 5; stroke-linecap: round; }
      .sword-shadow { stroke: rgba(4,18,21,0.86); stroke-width: 12; stroke-linecap: round; }
      .sword-glow { stroke: rgba(103,246,255,0.24); stroke-width: 26; stroke-linecap: round; filter: url(#hardGlow); }
      .cloth { fill: rgba(5,7,8,0.54); stroke: rgba(205,225,214,0.20); stroke-width: 1.2; }
      .cloth-light { fill: rgba(42,49,48,0.30); stroke: rgba(223,238,226,0.28); stroke-width: 1.1; }
      .sash { fill: none; stroke: rgba(19,23,24,0.82); stroke-width: 7.5; stroke-linecap: round; filter: url(#softGlow); }
      .sash-rim { fill: none; stroke: rgba(220,246,236,0.38); stroke-width: 1.8; stroke-linecap: round; }
      .hair { fill: none; stroke: rgba(7,9,10,0.90); stroke-width: 6.5; stroke-linecap: round; filter: url(#softGlow); }
      .hair-rim { fill: none; stroke: rgba(213,232,222,0.26); stroke-width: 1.4; stroke-linecap: round; }
      .wind { fill: none; stroke: rgba(146,250,255,0.30); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 28 120; filter: url(#softGlow); }
      .wind-soft { fill: none; stroke: rgba(242,255,255,0.14); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 42 170; filter: url(#softGlow); }
      .arc { fill: none; stroke: rgba(130,255,255,0.46); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 36 90; filter: url(#hardGlow); }
      .aura { fill: url(#cyanAura); opacity: 0.45; }
      .mote { fill: rgba(167,255,255,0.55); filter: url(#softGlow); }
    </style>
