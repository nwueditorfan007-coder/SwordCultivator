<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">御剑 V4 骨骼微动态预览</title>
  <desc id="desc">展示在保持 V4 主姿势的前提下，骨骼呼吸、控剑手腕、衣物和剑光如何做 idle 生命感。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffd36a"/>
    </marker>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #101719; }
      .panel { fill: rgba(255,255,255,0.045); stroke: rgba(178,238,239,0.18); stroke-width: 1.2; }
      .title { fill: #eaffff; font: 700 28px "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
      .label { fill: #dff9f8; font: 700 18px "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
      .note { fill: rgba(226,246,243,0.72); font: 15px "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
      .small { fill: rgba(226,246,243,0.56); font: 13px "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
      .warning { fill: #ffd36a; font: 700 16px "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
      .ghost { fill: none; stroke: rgba(226,244,240,0.18); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .bone { fill: none; stroke: #111516; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .bone-hi { fill: none; stroke: rgba(228,236,229,0.82); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .torso { fill: rgba(14,17,18,0.96); stroke: rgba(228,236,229,0.72); stroke-width: 2; }
      .head { fill: #141718; stroke: rgba(232,242,234,0.88); stroke-width: 2; }
      .joint { fill: #6effff; stroke: rgba(255,255,255,0.75); stroke-width: 1; }
      .foot-lock { fill: #ffdd7a; stroke: rgba(255,255,255,0.80); stroke-width: 1; }
      .sword-glow { stroke: rgba(91,246,255,0.25); stroke-width: 30; stroke-linecap: round; filter: url(#glow); }
      .sword { stroke: #dffeff; stroke-width: 6; stroke-linecap: round; }
      .sword-dark { stroke: #061114; stroke-width: 14; stroke-linecap: round; }
      .cloth { fill: rgba(3,6,7,0.62); stroke: rgba(222,236,227,0.28); stroke-width: 1.5; }
      .hair { fill: none; stroke: rgba(3,5,6,0.94); stroke-width: 7; stroke-linecap: round; filter: url(#glow); }
      .hair-hi { fill: none; stroke: rgba(226,238,229,0.32); stroke-width: 1.8; stroke-linecap: round; }
      .sash { fill: none; stroke: rgba(3,5,6,0.88); stroke-width: 8; stroke-linecap: round; filter: url(#glow); }
      .sash-hi { fill: none; stroke: rgba(226,238,229,0.35); stroke-width: 1.8; stroke-linecap: round; }
      .wind { fill: none; stroke: rgba(126,248,255,0.34); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 34 118; filter: url(#glow); }
      .motion { fill: none; stroke: #ffd36a; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); }
      .motion-soft { fill: none; stroke: rgba(255,211,106,0.50); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 7 8; }
      .bar-bg { fill: rgba(255,255,255,0.08); }
      .bar { fill: #6effff; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <rect class="panel" x="28" y="24" width="1224" height="92" rx="8"/>
  <text class="title" x="54" y="63">V4 Idle 新理解：锁主姿势，不是锁死骨骼</text>
  <text class="note" x="54" y="94">大体仍是你现在的御剑站姿；允许肩、头、髋、手腕做 1-5px 的呼吸和控剑微动作，脚底继续锁在剑上。</text>

  <rect class="panel" x="36" y="145" width="330" height="500" rx="8"/>
  <rect class="panel" x="392" y="145" width="520" height="500" rx="8"/>
  <rect class="panel" x="938" y="145" width="306" height="500" rx="8"/>

  <text class="label" x="62" y="184">保留的主姿势</text>
  <text class="small" x="62" y="210">骨骼大方向、站姿、脚剑关系不改</text>

  <g transform="translate(198 400) scale(1.28)" opacity="0.78">
    <line class="sword-dark" x1="-96" y1="88" x2="126" y2="88"/>
    <line class="sword" x1="-88" y1="88" x2="118" y2="88"/>
    <path class="ghost" d="M-24,-14 L-18,-72 L18,-72 L28,-16"/>
    <path class="ghost" d="M18,-72 C42,-58 54,-42 70,-32"/>
    <path class="ghost" d="M-18,-72 C-44,-62 -64,-48 -86,-42"/>
    <path class="ghost" d="M28,-16 C44,18 54,56 58,88"/>
    <path class="ghost" d="M-24,-14 C-34,22 -45,58 -50,88"/>
    <ellipse class="head" cx="-2" cy="-105" rx="16" ry="19" opacity="0.46"/>
    <polygon class="torso" points="-18,-72 18,-72 28,-16 -24,-14" opacity="0.42"/>
    <circle class="foot-lock" cx="-50" cy="88" r="5"/>
    <circle class="foot-lock" cx="58" cy="88" r="5"/>
  </g>
  <text class="warning" x="78" y="578">脚底锁剑</text>
  <text class="small" x="78" y="604">脚不滑，主 silhouette 不换</text>

  <text class="label" x="422" y="184">我要做的动态层</text>
  <text class="small" x="422" y="210">看黄色提示：骨骼小幅活起来，仍然保持这个姿势</text>

  <g transform="translate(652 412) scale(1.52)">
    <g opacity="0.26">
      <path class="ghost" d="M-24,-14 L-18,-72 L18,-72 L28,-16"/>
      <path class="ghost" d="M18,-72 C42,-58 54,-42 70,-32"/>
      <path class="ghost" d="M-18,-72 C-44,-62 -64,-48 -86,-42"/>
      <path class="ghost" d="M28,-16 C44,18 54,56 58,88"/>
      <path class="ghost" d="M-24,-14 C-34,22 -45,58 -50,88"/>
      <ellipse class="head" cx="-2" cy="-105" rx="16" ry="19"/>
    </g>

    <g id="staticSwordAndFeet">
      <line class="sword-glow" x1="-108" y1="88" x2="142" y2="88">
        <animate attributeName="opacity" values="0.20;0.36;0.20" dur="2.2s" repeatCount="indefinite"/>
      </line>
      <line class="sword-dark" x1="-100" y1="88" x2="132" y2="88"/>
      <line class="sword" x1="-90" y1="88" x2="122" y2="88"/>
      <circle class="foot-lock" cx="-50" cy="88" r="5"/>
      <circle class="foot-lock" cx="58" cy="88" r="5"/>
      <text class="small" x="-80" y="124" transform="scale(0.66)">脚锁住</text>
    </g>

    <path class="cloth" d="M-24,-14 C-42,24 -48,62 -36,92 C-10,104 26,100 45,90 C35,56 30,18 28,-16 Z">
      <animate attributeName="d" dur="2.0s" repeatCount="indefinite"
        values="M-24,-14 C-42,24 -48,62 -36,92 C-10,104 26,100 45,90 C35,56 30,18 28,-16 Z;
                M-24,-14 C-45,20 -54,60 -39,94 C-10,106 26,98 42,88 C32,54 28,16 28,-16 Z;
                M-24,-14 C-42,24 -48,62 -36,92 C-10,104 26,100 45,90 C35,56 30,18 28,-16 Z"/>
    </path>

    <path class="hair" d="M-8,-122 C-38,-130 -70,-116 -96,-86">
      <animate attributeName="d" dur="2.0s" repeatCount="indefinite"
        values="M-8,-122 C-38,-130 -70,-116 -96,-86;
                M-8,-122 C-42,-134 -72,-110 -99,-90;
                M-8,-122 C-38,-130 -70,-116 -96,-86"/>
    </path>
    <path class="hair-hi" d="M-9,-119 C-34,-124 -64,-110 -88,-86">
      <animate attributeName="d" dur="2.0s" repeatCount="indefinite"
        values="M-9,-119 C-34,-124 -64,-110 -88,-86;
                M-9,-119 C-38,-128 -66,-106 -92,-90;
                M-9,-119 C-34,-124 -64,-110 -88,-86"/>
    </path>
    <path class="sash" d="M-20,-16 C-58,-30 -104,-18 -144,8">
      <animate attributeName="d" dur="1.55s" repeatCount="indefinite"
        values="M-20,-16 C-58,-30 -104,-18 -144,8;
                M-20,-16 C-62,-18 -102,-34 -148,0;
                M-20,-16 C-58,-30 -104,-18 -144,8"/>
    </path>
    <path class="sash-hi" d="M-20,-18 C-56,-31 -100,-20 -138,5">
      <animate attributeName="d" dur="1.55s" repeatCount="indefinite"
        values="M-20,-18 C-56,-31 -100,-20 -138,5;
                M-20,-18 C-60,-20 -98,-36 -142,-3;
                M-20,-18 C-56,-31 -100,-20 -138,5"/>
    </path>

    <path class="wind" d="M-180,-24 C-86,-42 22,-34 174,-58">
      <animate attributeName="stroke-dashoffset" values="160;0" dur="1.25s" repeatCount="indefinite"/>
    </path>
    <path class="wind" d="M-190,42 C-90,20 18,28 184,10">
      <animate attributeName="stroke-dashoffset" values="180;0" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <g id="breathingSkeleton">
      <path class="bone" d="M-24,-14 C-30,24 -42,58 -50,88">
        <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
          values="M-24,-14 C-30,24 -42,58 -50,88;M-23,-18 C-31,22 -42,58 -50,88;M-24,-14 C-30,24 -42,58 -50,88"/>
      </path>
      <path class="bone-hi" d="M-24,-14 C-30,24 -42,58 -50,88">
        <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
          values="M-24,-14 C-30,24 -42,58 -50,88;M-23,-18 C-31,22 -42,58 -50,88;M-24,-14 C-30,24 -42,58 -50,88"/>
      </path>
      <path class="bone" d="M28,-16 C42,18 54,56 58,88">
        <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
          values="M28,-16 C42,18 54,56 58,88;M28,-20 C43,16 54,56 58,88;M28,-16 C42,18 54,56 58,88"/>
      </path>
      <path class="bone-hi" d="M28,-16 C42,18 54,56 58,88">
        <animate attributeName="d" dur="2.2s" repeatCount="indefinite"
          values="M28,-16 C42,18 54,56 58,88;M28,-20 C43,16 54,56 58,88;M28,-16 C42,18 54,56 58,88"/>
      </path>
      <polygon class="torso" points="-18,-72 18,-72 28,-16 -24,-14">
        <animate attributeName="points" dur="2.2s" repeatCount="indefinite"
          values="-18,-72 18,-72 28,-16 -24,-14;
                  -19,-76 17,-76 28,-20 -23,-18;
                  -18,-72 18,-72 28,-16 -24,-14"/>
      </polygon>
      <path class="bone" d="M18,-72 C42,-58 54,-42 70,-32">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M18,-72 C42,-58 54,-42 70,-32;M17,-76 C42,-62 56,-45 74,-35;M18,-72 C42,-58 54,-42 70,-32"/>
      </path>
      <path class="bone-hi" d="M18,-72 C42,-58 54,-42 70,-32">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M18,-72 C42,-58 54,-42 70,-32;M17,-76 C42,-62 56,-45 74,-35;M18,-72 C42,-58 54,-42 70,-32"/>
      </path>
      <path class="bone" d="M-18,-72 C-44,-62 -64,-48 -86,-42">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M-18,-72 C-44,-62 -64,-48 -86,-42;M-19,-76 C-45,-66 -67,-49 -90,-39;M-18,-72 C-44,-62 -64,-48 -86,-42"/>
      </path>
      <path class="bone-hi" d="M-18,-72 C-44,-62 -64,-48 -86,-42">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M-18,-72 C-44,-62 -64,-48 -86,-42;M-19,-76 C-45,-66 -67,-49 -90,-39;M-18,-72 C-44,-62 -64,-48 -86,-42"/>
      </path>
      <ellipse class="head" cx="-2" cy="-105" rx="16" ry="19">
        <animate attributeName="cy" values="-105;-109;-105" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="16;15.5;16" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle class="joint" cx="-18" cy="-72" r="3"/>
      <circle class="joint" cx="18" cy="-72" r="3"/>
      <circle class="joint" cx="-24" cy="-14" r="3"/>
      <circle class="joint" cx="28" cy="-16" r="3"/>
    </g>

    <path class="motion-soft" d="M-116,-42 C-104,-58 -96,-50 -86,-42"/>
    <path class="motion" d="M-116,-42 C-103,-64 -94,-53 -86,-42"/>
    <path class="motion" d="M-2,-142 C-2,-132 -2,-122 -2,-113"/>
    <path class="motion" d="M72,-24 C86,-36 92,-48 86,-60"/>
  </g>

  <text class="warning" x="435" y="590">骨骼可动：头/肩/髋上下呼吸，手腕小弧线控剑</text>
  <text class="small" x="435" y="618">幅度小，节奏慢；玩家看到的是“活着的御剑姿势”，不是换动作</text>

  <text class="label" x="966" y="184">状态拆法</text>
  <text class="small" x="966" y="212">同一姿势，不同状态只调幅度</text>

  <g transform="translate(966 250)">
    <text class="note" x="0" y="0">悬停 idle</text>
    <rect class="bar-bg" x="0" y="14" width="220" height="12" rx="6"/>
    <rect class="bar" x="0" y="14" width="70" height="12" rx="6">
      <animate attributeName="width" values="58;82;58" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text class="small" x="0" y="52">呼吸最明显，风最弱</text>
  </g>

  <g transform="translate(966 342)">
    <text class="note" x="0" y="0">巡航 idle</text>
    <rect class="bar-bg" x="0" y="14" width="220" height="12" rx="6"/>
    <rect class="bar" x="0" y="14" width="122" height="12" rx="6">
      <animate attributeName="width" values="110;138;110" dur="1.55s" repeatCount="indefinite"/>
    </rect>
    <text class="small" x="0" y="52">手腕控剑、衣物滞后</text>
  </g>

  <g transform="translate(966 434)">
    <text class="note" x="0" y="0">高速/回收 idle</text>
    <rect class="bar-bg" x="0" y="14" width="220" height="12" rx="6"/>
    <rect class="bar" x="0" y="14" width="176" height="12" rx="6">
      <animate attributeName="width" values="160;208;160" dur="0.74s" repeatCount="indefinite"/>
    </rect>
    <text class="small" x="0" y="52">身体更紧，剑光和风更强</text>
  </g>

  <text class="warning" x="966" y="558">实现原则</text>
  <text class="small" x="966" y="586">保留 F4 姿态作为基准</text>
  <text class="small" x="966" y="612">运行时只做 additive 微偏移</text>
</svg>
