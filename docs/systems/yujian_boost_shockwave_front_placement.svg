<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Yujian boost shockwave front placement concept</title>
  <desc id="desc">A readable side-view sword-riding cultivator dashing forward. The shockwave oval is placed in front of the sword tip, while afterimages and speed streaks trail behind.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ede9"/>
      <stop offset="0.48" stop-color="#f4fbf7"/>
      <stop offset="1" stop-color="#bed5dc"/>
    </linearGradient>
    <linearGradient id="speedFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#f8ffff" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.42" stop-color="#e7ffff" stop-opacity="0.82"/>
      <stop offset="0.68" stop-color="#70f2ff" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="frontMist" cx="48%" cy="50%" r="58%">
      <stop offset="0" stop-color="#f8ffff" stop-opacity="0.36"/>
      <stop offset="0.46" stop-color="#d2ffff" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#d2ffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#26515a" opacity="0.86"/>
    </marker>
    <style>
      .guide { fill: none; stroke: #26515a; stroke-width: 2; stroke-linecap: round; opacity: 0.48; }
      .label { fill: #26464d; font: 600 18px Arial, sans-serif; letter-spacing: 0; }
      .note { fill: #42656b; font: 14px Arial, sans-serif; letter-spacing: 0; }
      .speed { fill: none; stroke: url(#speedFade); stroke-linecap: round; }
      .ink { fill: none; stroke: #141d22; stroke-linecap: round; stroke-linejoin: round; }
      .cloth { fill: none; stroke: #4a2388; stroke-linecap: round; stroke-linejoin: round; }
      .cyan { fill: none; stroke: #bffcff; stroke-linecap: round; stroke-linejoin: round; }
      .wave { fill: none; stroke: url(#waveStroke); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0,590 C180,548 324,632 486,590 C658,546 820,618 1000,582 C1120,558 1200,568 1280,550 L1280,720 L0,720 Z" fill="#9fbfc3" opacity="0.13"/>
  <path d="M0,455 C138,432 242,466 368,440 C524,408 648,464 798,430 C974,390 1100,426 1280,398" fill="none" stroke="#557980" stroke-width="2" opacity="0.12"/>

  <g id="speed-streaks">
    <path class="speed" d="M130,245 L620,226" stroke-width="8" opacity="0.30"/>
    <path class="speed" d="M145,310 L585,298" stroke-width="5" opacity="0.42"/>
    <path class="speed" d="M210,382 L650,360" stroke-width="4" opacity="0.36"/>
    <path class="speed" d="M270,443 L590,424" stroke-width="3" opacity="0.28"/>
    <path class="speed" d="M92,492 L520,468" stroke-width="4" opacity="0.19"/>
    <path class="speed" d="M340,185 L678,177" stroke-width="3" opacity="0.18"/>
  </g>

  <g id="afterimages" opacity="0.42">
    <g transform="translate(-126 24) scale(0.98)">
      <path class="cloth" d="M448,384 C388,386 332,414 292,462" stroke-width="13" opacity="0.20"/>
      <path class="cyan" d="M404,388 C474,356 548,344 666,350" stroke-width="9" opacity="0.25"/>
      <path class="ink" d="M470,320 L602,352 L486,438" stroke-width="9" opacity="0.14"/>
      <circle cx="516" cy="304" r="18" fill="#121b20" opacity="0.16"/>
    </g>
    <g transform="translate(-62 10) scale(0.99)">
      <path class="cloth" d="M448,384 C386,400 332,438 304,490" stroke-width="14" opacity="0.24"/>
      <path class="cyan" d="M412,390 C484,360 560,350 690,356" stroke-width="8" opacity="0.26"/>
      <path class="ink" d="M492,320 L626,354 L510,442" stroke-width="10" opacity="0.15"/>
      <circle cx="540" cy="304" r="18" fill="#121b20" opacity="0.18"/>
    </g>
  </g>

  <g id="rear-ink-fragments" opacity="0.62">
    <path class="ink" d="M430,242 L528,232" stroke-width="4" opacity="0.22"/>
    <path class="ink" d="M482,262 L618,250" stroke-width="3" opacity="0.24"/>
    <path class="ink" d="M350,476 L520,452" stroke-width="4" opacity="0.16"/>
    <path class="cyan" d="M330,214 L480,204" stroke-width="3" opacity="0.17"/>
    <path class="cyan" d="M470,505 L650,480" stroke-width="2.5" opacity="0.17"/>
  </g>

  <g id="sword" transform="translate(0 0)">
    <path d="M326,430 C420,386 560,358 760,350 C614,384 470,424 318,468 C304,472 300,454 314,446 Z" fill="#10191e" opacity="0.92"/>
    <path d="M342,444 C462,404 588,374 746,354" class="cyan" stroke-width="7" opacity="0.62"/>
    <path d="M362,455 C494,424 618,390 724,366" class="cyan" stroke-width="17" opacity="0.12"/>
    <path d="M760,350 L803,346 L761,361 Z" fill="#eefeff" opacity="0.90"/>
    <path d="M742,354 L800,346" class="cyan" stroke-width="3" opacity="0.85"/>
  </g>

  <g id="rider" transform="translate(0 0)">
    <path class="cloth" d="M520,360 C466,382 402,424 342,494" stroke-width="18" opacity="0.82"/>
    <path class="cloth" d="M520,360 C458,340 406,315 350,270" stroke-width="13" opacity="0.80"/>
    <path class="cloth" d="M548,376 C512,422 492,476 470,552" stroke-width="14" opacity="0.80"/>
    <path class="cloth" d="M554,380 C612,418 660,452 714,496" stroke-width="12" opacity="0.74"/>
    <path d="M468,364 C530,320 604,310 706,338 C602,360 540,394 486,448 Z" fill="#121b20" opacity="0.96"/>
    <path class="ink" d="M530,332 C592,326 652,330 716,338" stroke-width="12"/>
    <path class="ink" d="M492,410 C540,382 608,358 702,344" stroke-width="10"/>
    <path class="ink" d="M498,356 C456,372 410,398 360,438" stroke-width="9" opacity="0.88"/>
    <path class="ink" d="M548,394 C526,444 520,488 508,536" stroke-width="10" opacity="0.88"/>
    <path class="ink" d="M570,390 C626,420 672,452 734,492" stroke-width="9" opacity="0.88"/>
    <circle cx="536" cy="306" r="25" fill="#11191e"/>
    <path d="M510,320 C526,344 568,344 596,330" class="ink" stroke-width="12"/>
    <path class="cyan" d="M472,374 C538,348 612,340 712,344" stroke-width="6" opacity="0.54"/>
    <path class="cyan" d="M515,360 C465,382 412,424 364,486" stroke-width="5" opacity="0.34"/>
  </g>

  <g id="front-shockwave" filter="url(#softGlow)">
    <ellipse cx="844" cy="352" rx="92" ry="202" fill="url(#frontMist)" opacity="0.76"/>
    <ellipse class="wave" cx="844" cy="352" rx="62" ry="160" stroke-width="8" opacity="0.88" stroke-dasharray="188 30 76 42"/>
    <ellipse class="wave" cx="851" cy="352" rx="82" ry="198" stroke-width="4" opacity="0.58" stroke-dasharray="64 34 210 42"/>
    <ellipse cx="824" cy="352" rx="27" ry="126" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.36" stroke-dasharray="44 28"/>
    <path d="M800,346 C820,334 835,328 860,328" class="cyan" stroke-width="5" opacity="0.74"/>
    <path d="M800,346 C822,378 840,402 866,424" class="cyan" stroke-width="4" opacity="0.40"/>
  </g>

  <g id="front-fragments" opacity="0.76">
    <path class="ink" d="M888,222 L946,206" stroke-width="3" opacity="0.28"/>
    <path class="ink" d="M900,268 L1010,244" stroke-width="4" opacity="0.18"/>
    <path class="ink" d="M882,494 L960,520" stroke-width="3" opacity="0.18"/>
    <path class="cyan" d="M896,316 L1038,304" stroke-width="2.5" opacity="0.24"/>
    <path class="cyan" d="M898,399 L990,414" stroke-width="2.5" opacity="0.20"/>
    <path class="cyan" d="M922,354 L1120,350" stroke-width="1.6" opacity="0.15"/>
  </g>

  <g id="placement-guides">
    <path class="guide" d="M210,635 L1060,635" marker-end="url(#arrow)"/>
    <text class="label" x="500" y="672">boost direction</text>
    <line x1="536" y1="166" x2="536" y2="558" stroke="#26515a" stroke-width="1.4" stroke-dasharray="5 8" opacity="0.22"/>
    <line x1="800" y1="166" x2="800" y2="558" stroke="#26515a" stroke-width="1.4" stroke-dasharray="5 8" opacity="0.34"/>
    <line x1="844" y1="166" x2="844" y2="558" stroke="#26515a" stroke-width="1.4" stroke-dasharray="5 8" opacity="0.22"/>
    <text class="note" x="478" y="148">rider</text>
    <text class="note" x="752" y="148">sword tip</text>
    <text class="note" x="866" y="148">shockwave center</text>
    <path d="M800,160 C816,118 838,110 844,160" fill="none" stroke="#26515a" stroke-width="1.6" opacity="0.42" marker-end="url(#arrow)"/>
    <text class="label" x="728" y="96">front oval touches the thrust line</text>
  </g>
</svg>
